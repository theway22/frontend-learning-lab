<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
    // 需求：在循环打印1到5的过程中，打印到3就停下来，但是后面的4和5还会打印。 (1  2   4  5 )

    for(var i=1;i<=5;i++){
        // if(i等于3){
        //     结束本次循环
        // }
        if(i===3){
            continue;
            console.log("continue后面的代码不会执行");
            // 问题：为什么后面的console.log(i)会不执行了？continue不是在if里面吗？
            // 答：continue 的作用范围是 整个循环体，而不仅是 if 语句内部。continue 执行时，当前循环块内剩余的所有代码都会被跳过。
            // 因此 console.log(i) 在 i=3 时不会执行。
            // 对比 break：
            // break 会直接终止整个循环，而 continue 只是跳过当前迭代。
        }
        console.log(i);
    }

    // break 结束的是整个循环, 后面的循环也不执行了
    // continue 结束的是本次循环,循环还是会继续
    </script>
</head>
<body>
    
</body>
</html>
